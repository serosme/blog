on:
  push:
    branches:
      - main
  workflow_dispatch:

name: Deploy to Cloudflare Pages

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - run: npm ci

      - run: npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: vitepress-build
          path: docs/.vitepress/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_PAGES_PROJECT: blog
      CF_PRODUCTION_BRANCH: main

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: vitepress-build
          path: dist

      - run: npm install -g wrangler

      - run: |
          if ! wrangler pages project list --json | jq -e 'map(."Project Name") | contains(["'"$CF_PAGES_PROJECT"'"])' >/dev/null; then
              wrangler pages project create $CF_PAGES_PROJECT --production-branch=$CF_PRODUCTION_BRANCH
          fi

      - run: wrangler pages deploy dist --project-name=$CF_PAGES_PROJECT --branch=$CF_PRODUCTION_BRANCH
